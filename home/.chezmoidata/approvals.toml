# Command prefixes every agent host gates. ask: a human approves each time. judge: the host's
# reviewer decides (Claude Code classifier, Codex auto_review), so only a host without one prompts.
# A prefix is words split on single spaces. A pattern needing a wildcard stays in the host file.
# optionsFirst: CLIs that take options before the verb. Glob hosts also gate "<cli> <options> <verb>".
[approvals]
optionsFirst = [
  "terraform",
  "tofu",
  "helm",
  "kubectl",
  "alembic",
  "supabase",
  "vercel",
  "wrangler",
  "firebase",
