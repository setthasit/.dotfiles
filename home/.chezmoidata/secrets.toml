[secrets]
homeDirs = [".ssh", ".aws", ".gnupg", ".kube", ".config/gh"]
homeFiles = [
  ".netrc",
  ".zshrc.local",
  ".claude.json",
  ".codex/auth.json",
  ".local/share/opencode/auth.json",
  ".local/share/opencode/mcp-auth.json",
]
fileGlobs = [".env", ".env.*", "*.pem", "id_rsa*", "id_ecdsa*", "id_ed25519*"]
readable = [".env.example", ".env.sample", ".env.template"]
