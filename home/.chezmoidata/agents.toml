# Per-role facts the Codex and OpenCode agent files render from. Each role's description,
# skills, and instructions live in its Claude Code agent file, dot_claude/agents/<role>.md.tmpl.
# reviewer = no web search and no MCP servers. browser = runs the [playwright] server below.
# delegates = roles it may spawn. todowrite = may use OpenCode's todo list.
# CI pins every role's permissions and delegates in .github/scripts/agent_roles.py.

[playwright]
command = "npx"
args = ["-y", "@playwright/mcp@0.0.82", "--headless", "--isolated", "--output-dir", "/tmp/agent/playwright"]

[roles.task]
model = "gpt-6.1-sol"
effort = "high"
permissions = ":danger-full-access"
reviewer = false
browser = false
delegates = []
todowrite = false

[roles.task-light]
model = "gpt-6-luna"
effort = "high"
permissions = ":danger-full-access"
reviewer = false
browser = false
delegates = []
todowrite = false

[roles.sonic]
model = "gpt-6-luna"
effort = "high"
permissions = ":danger-full-access"
reviewer = false
browser = false
delegates = []
todowrite = false

[roles.scout]
model = "gpt-6-luna"
effort = "high"
permissions = "project-read"
reviewer = false
browser = false
delegates = []
todowrite = false

[roles.reviewer]
model = "gpt-6.1-sol"
effort = "high"
permissions = "project-read"
reviewer = true
browser = false
delegates = []
todowrite = false

[roles.ship-reviewer]
model = "gpt-6.1-sol"
effort = "xhigh"
permissions = "project-read"
reviewer = true
browser = false
delegates = []
todowrite = false

[roles.security-reviewer]
model = "gpt-6.1-sol"
effort = "xhigh"
permissions = "project-read"
reviewer = true
browser = false
delegates = []
todowrite = false

[roles.tester]
model = "gpt-6-luna"
effort = "high"
permissions = "project-read"
reviewer = false
browser = true
delegates = []
todowrite = false

[roles.uxui-designer]
model = "gpt-6.1-sol"
effort = "high"
permissions = ":danger-full-access"
reviewer = false
browser = true
delegates = []
todowrite = false

[roles.uxui-design-review]
model = "gpt-6.1-sol"
effort = "high"
permissions = "project-read"
reviewer = false
browser = true
delegates = []
todowrite = false

[roles.planner]
model = "gpt-6-astra"
effort = "xhigh"
permissions = "project-edit"
reviewer = false
browser = false
delegates = ["scout"]
todowrite = false

[roles.coordinator]
model = "gpt-6-astra"
effort = "high"
permissions = "project-edit"
reviewer = false
browser = false
delegates = [
  "task",
  "task-light",
  "sonic",
  "scout",
  "reviewer",
  "ship-reviewer",
  "security-reviewer",
  "tester",
  "uxui-designer",
  "uxui-design-review",
]
todowrite = true
