{{- $role := index .root.roles .name -}}
{{- $definition := includeTemplate "agent-definition" (dict "name" .name "root" .root) | fromJson -}}
name = {{ .name | toJson }}
description = {{ $definition.description | toJson }}
model = {{ $role.model | toJson }}
model_reasoning_effort = {{ $role.effort | toJson }}
default_permissions = {{ $role.permissions | toJson }}
developer_instructions = {{ $definition.instructions | toJson }}
{{ if $role.reviewer }}
web_search = "disabled"
{{ includeTemplate "codex-mcp.toml" (dict "enabled" false "servers" .root.mcpServers) }}
{{ end }}
[agents]
enabled = {{ gt (len $role.delegates) 0 }}
{{ if $role.browser }}
[mcp_servers."playwright"]
command = {{ .root.playwright.command | toJson }}
args = {{ .root.playwright.args | toJson }}
{{ end }}
