name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CHEZMOI_CONFIG: ${{ github.workspace }}/../chezmoi-ci.toml
  SANDBOX_HOME: ${{ github.workspace }}/../sandbox-home

jobs:
  verify:
    # .chezmoiignore drops Library and ghostty off darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: brew install chezmoi shellcheck gitleaks jq mise

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned Codex CLI
        run: |
          codex_version="$(python3 -c 'import tomllib; print(tomllib.load(open("dot_config/mise/config.toml", "rb"))["tools"]["codex"])')"
          mise install "codex@$codex_version"
          printf '%s\n' "$(mise where "codex@$codex_version")/bin" >> "$GITHUB_PATH"

      - name: Scan history for secrets
        run: gitleaks git . --redact --no-banner

      - name: Scan for identity and unmanaged-file leaks
        run: ./.github/scripts/check-identity-leak.sh

      - name: Check every shared skill is linked into Claude Code
        run: ./.github/scripts/check-claude-skill-links.sh

      - name: Render the Claude Code status line
        run: ./.github/scripts/check-statusline.sh

      - name: Validate Codex configuration and permissions
        run: python3 .github/scripts/check-codex.py

      - name: Render every managed file
        run: |
          mkdir -p "$SANDBOX_HOME"
          cp .github/chezmoi-ci.toml "$CHEZMOI_CONFIG"
          # externals clone over the network, scripts install packages
          chezmoi --config="$CHEZMOI_CONFIG" --source="$PWD" --destination="$SANDBOX_HOME" \
            --no-tty apply --force --exclude=externals,scripts

      - name: Lint scripts
        run: |
          shopt -s nullglob
          mkdir -p "$SANDBOX_HOME/scripts"
          for template in run_*.sh.tmpl; do
            chezmoi --config="$CHEZMOI_CONFIG" --source="$PWD" --destination="$SANDBOX_HOME" \
              --no-tty execute-template < "$template" \
              > "$SANDBOX_HOME/scripts/$(basename "$template" .tmpl)"
          done
          shellcheck .github/scripts/*.sh dot_claude/*.sh run_*.sh "$SANDBOX_HOME"/scripts/*.sh

      - name: Parse Brewfile
        run: brew bundle list --file=Brewfile > /dev/null
