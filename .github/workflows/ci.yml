name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SANDBOX_HOME: ${{ github.workspace }}/../sandbox-home

jobs:
  verify:
    # .chezmoiignore drops ghostty off darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - run: brew install chezmoi shellcheck gitleaks jq mise

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the pinned agent CLIs
        run: python3 .github/scripts/install-pinned-clis.py codex opencode claude >> "$GITHUB_PATH"

      - name: Scan history for secrets
        run: gitleaks git . --redact --no-banner

      - name: Scan for identity and unmanaged-file leaks
        run: ./.github/scripts/check-identity-leak.sh

      - name: Check every shared skill is linked into Claude Code
        run: ./.github/scripts/check-claude-skill-links.sh

      - name: Check agent-facing Markdown for em dashes
        run: ./.github/scripts/check-em-dash.sh

      - name: Render the Claude Code status line
        run: ./.github/scripts/check-statusline.sh

      - name: Validate Codex configuration and permissions
        run: python3 .github/scripts/check-codex.py

      - name: Validate OpenCode configuration and permissions
        run: python3 .github/scripts/check-opencode.py

      - name: Render every managed file
        run: python3 .github/scripts/render-home.py "$SANDBOX_HOME"

      - name: Check every host's approval tiers
        run: python3 .github/scripts/check-approvals.py "$SANDBOX_HOME"

      - name: Validate Claude Code configuration
        run: python3 .github/scripts/check-claude.py "$SANDBOX_HOME"

      # Rendered tree only: source file names carry chezmoi prefixes the skill pointers lack.
      - name: Audit the shared skills
        run: python3 "$SANDBOX_HOME/.agents/skills/writing-for-agents/scripts/check_skills.py"

      - name: Run the unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Run the plan-band mod tests
        env:
          DISABLE_AUTOUPDATER: "1"
        run: claude plugin test "$SANDBOX_HOME/.claude/mods/plan-band"

      - name: Lint scripts
        run: |
          shopt -s nullglob
          mkdir -p "$SANDBOX_HOME/scripts"
          for template in home/run_*.sh.tmpl; do
            chezmoi --config=.github/chezmoi-ci.toml --persistent-state="$RUNNER_TEMP/chezmoi-state.boltdb" \
              --source="$PWD" --destination="$SANDBOX_HOME" --no-tty execute-template < "$template" \
              > "$SANDBOX_HOME/scripts/$(basename "$template" .tmpl)"
          done
          git ls-files -z '*.sh' | xargs -0 shellcheck "$SANDBOX_HOME"/scripts/*.sh

      - name: Parse Brewfile
        run: brew bundle list --file=Brewfile > /dev/null
