name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CHEZMOI_CONFIG: ${{ github.workspace }}/../chezmoi-ci.toml
  SANDBOX_HOME: ${{ github.workspace }}/../sandbox-home

jobs:
  verify:
    # .chezmoiignore drops Library and ghostty off darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: brew install chezmoi shellcheck gitleaks

      - name: Scan history for secrets
        run: gitleaks git . --redact --no-banner

      - name: Scan for identity and unmanaged-file leaks
        run: ./.github/scripts/check-identity-leak.sh

      - name: Render every managed file
        run: |
          mkdir -p "$SANDBOX_HOME"
          printf '[data]\nname = "ci"\nemail = "ci@example.invalid"\n' > "$CHEZMOI_CONFIG"
          # externals clone over the network, scripts install packages
          chezmoi --config="$CHEZMOI_CONFIG" --source="$PWD" --destination="$SANDBOX_HOME" \
            --no-tty apply --force --exclude=externals,scripts

      - name: Lint scripts
        run: |
          shopt -s nullglob
          mkdir -p "$SANDBOX_HOME/scripts"
          for template in run_*.sh.tmpl; do
            chezmoi --config="$CHEZMOI_CONFIG" --source="$PWD" --destination="$SANDBOX_HOME" \
              --no-tty execute-template < "$template" \
              > "$SANDBOX_HOME/scripts/$(basename "$template" .tmpl)"
          done
          shellcheck .github/scripts/*.sh run_*.sh "$SANDBOX_HOME"/scripts/*.sh

      - name: Parse Brewfile
        run: brew bundle list --file=Brewfile > /dev/null
