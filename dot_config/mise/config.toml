# Global floor. Per-project pins live in the project's own .mise.toml and win over this.
[tools]
# Language runtimes
node = ["24.11.0", "22.17.0"]
python = ["3.12", "3.11"]
go = "1.25.3"
java = "temurin-21.0.3+9"
kotlin = "2.1.10"
bun = "1.3.14"
deno = "2.4.3"

# CLIs whose version a project or CI must match, so a single global Homebrew
# HEAD is the wrong model for them. Bump deliberately, not with `brew upgrade`.
terraform = "1.14.3"
opentofu = "1.12.6"
kubectl = "1.37.0"
helm = "4.2.4"
k9s = "0.50.16"
pulumi = "3.209.0"
atlas = "0.38.0"
buf = "1.61.0"
golangci-lint = "2.13.2"
k6 = "2.2.0"
tuist = "4.109.1"
stripe = "1.33.0"

[settings]
# Honour .nvmrc in existing repos so per-project node pins keep working.
idiomatic_version_file_enable_tools = ["node"]
