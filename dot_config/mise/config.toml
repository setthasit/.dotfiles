# Global floor. Per-project pins live in the project's own .mise.toml and win over this.
[tools]
# Language runtimes
node = ["24.11.0", "22.17.0"]
python = ["3.12", "3.11"]
go = "1.25.3"
java = "temurin-21.0.3+9"
kotlin = "2.1.10"
bun = "1.3.14"
deno = "2.4.3"
lua = "5.5.1"
ruby = "4.0.7"
rust = "1.98.1"

# Editor. Pinned here rather than Homebrew so the version travels to Linux.
neovim = "0.12.5"

# CLIs pinned to an exact version instead of tracking a global Homebrew HEAD.
# Bump deliberately, not with `brew upgrade`.
terraform = "1.14.3"
kubectl = "1.37.0"
helm = "4.2.4"
k9s = "0.50.16"
pulumi = "3.209.0"
atlas = "0.38.0"
buf = "1.61.0"
golangci-lint = "2.13.2"
k6 = "2.2.0"
tuist = "4.109.1"
stripe = "1.33.0"
herdr = "0.9.0"

# Apple-only toolchain. The os filter keeps `mise install` clean on Linux.
cocoapods = { version = "1.17.0", os = ["macos"] }
swiftformat = { version = "0.63.0", os = ["macos"] }
swiftlint = { version = "0.65.1", os = ["macos"] }
xcbeautify = { version = "3.2.1", os = ["macos"] }

[settings]
# Honour .nvmrc in existing repos so per-project node pins keep working.
idiomatic_version_file_enable_tools = ["node"]
