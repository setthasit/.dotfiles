{{- $source := include (printf "dot_claude/agents/%s.md" .name) -}}
{{- $frontmatter := regexFind "(?s)^---\n(.*?)\n---\n" $source -}}
{{- $metadata := $frontmatter | trimPrefix "---\n" | trimSuffix "\n---\n" | fromYaml -}}
{{- $body := $source | trimPrefix $frontmatter | trim -}}
name = {{ .name | toJson }}
description = {{ $metadata.description | toJson }}
model = {{ .model | toJson }}
model_reasoning_effort = {{ .effort | toJson }}
default_permissions = {{ .permissions | toJson }}
developer_instructions = {{ $body | toJson }}
{{ if .review }}
web_search = "disabled"
{{ template "codex-mcp.toml" (dict "enabled" false "servers" .mcpServers) }}
{{ end }}
[agents]
enabled = false
{{ range get $metadata "mcpServers" | default (list) }}
{{- range $name, $server := . }}
[mcp_servers.{{ $name }}]
command = {{ $server.command | toJson }}
args = {{ $server.args | toJson }}
{{ end }}
{{- end }}
